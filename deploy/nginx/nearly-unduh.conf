# Unduhan APK Android untuk VPS BERSAMA dengan nginx (spec distribusi D4, D13) —
# padanan blok kedua deploy/Caddyfile. Langkah pasang di docs/demo/runbook.md
# bagian 1.5b dan 1.7. __NEARLY_DOWNLOAD_HOST__ diganti saat dipasang (sed);
# blok 443 ditambahkan certbot.

server {
	listen 80;
	listen [::]:80;
	server_name __NEARLY_DOWNLOAD_HOST__;

	root /srv/nearly/unduh;
	autoindex off;

	location ~ \.apk$ {
		types { }
		default_type application/vnd.android.package-archive;
		# Nama berkas tetap (nearly.apk) sementara isinya berganti tiap build.
		add_header Cache-Control "no-cache" always;
	}

	location / {
		try_files $uri =404;
	}
}
