# nginx di depan API Nearly untuk VPS BERSAMA yang sudah memakai nginx di port
# 80/443 (spec distribusi D13) — padanan blok pertama deploy/Caddyfile.
# Langkah pasang di docs/demo/runbook.md bagian 1.5b. __NEARLY_API_HOST__ diganti
# saat dipasang (sed). Blok 443 dan pengalihan http→https ditambahkan certbot
# (`certbot --nginx`), sama seperti situs lain di mesin itu.

# /graf/* publik tanpa autentikasi (spec 6 §4.5): paling banyak 16 permintaan
# graf sekaligus ke API, supaya lonjakan penonton /live tidak merebut koneksi
# salaman dan check-in. Berbeda dengan Caddy, nginx tidak mengantre kelebihannya
# melainkan menjawab 503; web /live sudah mencoba ulang dengan jeda (jeda.ts).
limit_conn_zone $server_name zone=nearly_graf:1m;

upstream nearly_api {
	# HOST=127.0.0.1 di /etc/nearly/api.env: API tidak terjangkau dari luar mesin.
	server 127.0.0.1:8787;
	keepalive 16;
}

server {
	listen 80;
	listen [::]:80;
	server_name __NEARLY_API_HOST__;

	# Gambar Feed sampai 3 MB (BATAS_BADAN_GAMBAR, routes/feed.ts); bawaan nginx
	# 1 MB akan menolaknya dengan 413 sebelum sampai ke API.
	client_max_body_size 4m;

	proxy_http_version 1.1;
	proxy_set_header Connection "";
	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $scheme;

	location /graf/ {
		limit_conn nearly_graf 16;
		limit_conn_status 503;
		proxy_pass http://nearly_api;
	}

	location / {
		proxy_pass http://nearly_api;
	}
}
